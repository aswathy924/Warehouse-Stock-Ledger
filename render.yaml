services:
  # Backend: FastAPI Web Service
  - type: web
    name: warehouse-stock-ledger-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head && python seed.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.9

  # Frontend: Vite + React Static Site
  - type: web
    name: warehouse-stock-ledger-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: warehouse-stock-ledger-backend
          property: host

databases:
  - name: warehouse-db
    region: oregon
    plan: free
    databaseName: warehouse_db
    user: warehouse_user
